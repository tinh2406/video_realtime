[package]
name = "video_server"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-files = "0.6"
actix-ws = "0.3"
futures-util = "0.3"
mime_guess = "2"
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread"] }
toml = "0.8"
turn-server = { version = "4.1.5", default-features = false, features = ["udp", "tcp"] }
