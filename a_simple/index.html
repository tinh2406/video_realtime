<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebRTC P2P Video Call</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .videos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        video {
            width: 100%;
            background: #111;
            border-radius: 8px;
            min-height: 240px;
        }

        .guide-box {
            background: #eef6ff;
            border-left: 4px solid #1a73e8;
            padding: 12px 16px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.5;
        }

        .guide-box ol {
            margin: 6px 0 0 18px;
            padding: 0;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            margin-top: 10px;
            font-family: monospace;
        }

        button {
            margin: 5px;
            padding: 10px 15px;
            cursor: pointer;
        }

        .status {
            margin: 15px 0;
            padding: 10px;
            background: #eee;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <h1>WebRTC P2P Video Call (2 chiều)</h1>


    <div class="videos">
        <div>
            <h3>Local (Của bạn)</h3>
            <video id="localVideo" autoplay muted playsinline></video>
        </div>

        <div>
            <h3>Remote (Đối phương)</h3>
            <video id="remoteVideo" autoplay playsinline muted></video>
        </div>
    </div>

    <div class="status">
        Connection:
        <span id="connectionState">new</span>
        <br />

        ICE:
        <span id="iceConnectionState">new</span>
        <br />

        ICE Gathering:
        <span id="iceGatheringState">new</span>
    </div>

    <hr />

    <h2>1. Media</h2>

    <button onclick="startCamera()">
        Camera + Mic
    </button>

    <button onclick="shareScreen()">
        Share Screen
    </button>

    <button onclick="stopMedia()">
        Stop Media
    </button>

    <hr />

    <h2>2. Signaling</h2>

    <button onclick="createOffer()">
        Create Offer
    </button>

    <button onclick="createAnswer()">
        Create Answer
    </button>

    <br />

    <label>Local SDP</label>
    <textarea id="localSdp"></textarea>

    <br />

    <label>Remote SDP</label>
    <textarea id="remoteSdp"></textarea>

    <br />

    <button onclick="setRemoteSdp()">
        Set Remote SDP
    </button>

    <script>
        const localVideo = document.getElementById("localVideo");
        const remoteVideo = document.getElementById("remoteVideo");

        const localSdp = document.getElementById("localSdp");
        const remoteSdp = document.getElementById("remoteSdp");

        const connectionState = document.getElementById("connectionState");
        const iceConnectionState = document.getElementById("iceConnectionState");
        const iceGatheringState = document.getElementById("iceGatheringState");

        const pc = new RTCPeerConnection({
            iceServers: [
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "stun:stun1.l.google.com:19302" }
            ]
        });

        let localStream = null;

        /*
         * ==========================================
         * 1. TẠO MEDIA SECTIONS NGAY TỪ ĐẦU (2 CHIỀU)
         * ==========================================
         */

        function getTransceiver(kind) {
            // Tìm transceiver có sẵn (do Set Remote SDP tạo ra)
            let transceiver = pc.getTransceivers().find(t => t.receiver.track.kind === kind);

            // Nếu chưa có (mình là người gọi - Máy A), thì tạo mới
            if (!transceiver) {
                transceiver = pc.addTransceiver(kind, { direction: "sendrecv" });
            }
            return transceiver;
        }


        /*
         * ==========================================
         * 2. NHẬN MEDIA TỪ REMOTE
         * ==========================================
         */

        const remoteStream = new MediaStream();
        remoteVideo.srcObject = remoteStream;

        pc.ontrack = (event) => {
            console.log("🔥 REMOTE TRACK:", {
                kind: event.track.kind,
                readyState: event.track.readyState,
                muted: event.track.muted,
                streams: event.streams.length,
            });

            if (!remoteStream.getTracks().some(t => t.id === event.track.id)) {
                remoteStream.addTrack(event.track);
            }

            event.track.onunmute = () => {
                console.log("🔥 REMOTE TRACK UNMUTED:", event.track.kind);
                remoteVideo.play().catch(err => {
                    console.warn("Autoplay notice (onunmute):", err.message);
                });
            };

            event.track.onmute = () => {
                console.log("🔥 REMOTE TRACK MUTED:", event.track.kind);
            };

            remoteVideo.play().catch(err => {
                console.warn("Autoplay notice (ontrack):", err.message);
            });
        };


        /*
         * ==========================================
         * 3. STATE
         * ==========================================
         */

        pc.onconnectionstatechange = () => {
            connectionState.textContent = pc.connectionState;

            console.log(
                "Connection state:",
                pc.connectionState
            );
        };

        pc.oniceconnectionstatechange = () => {
            iceConnectionState.textContent =
                pc.iceConnectionState;

            console.log(
                "ICE connection state:",
                pc.iceConnectionState
            );
        };

        pc.onicegatheringstatechange = () => {
            iceGatheringState.textContent =
                pc.iceGatheringState;

            console.log(
                "ICE gathering state:",
                pc.iceGatheringState
            );
        };


        /*
         * ==========================================
         * 4. CAMERA + MIC
         * ==========================================
         */

        async function startCamera() {
            const stream =
                await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });

            await setLocalMedia(stream);
        }


        /*
         * ==========================================
         * 5. SCREEN SHARE
         * ==========================================
         */

        async function shareScreen() {
            const stream =
                await navigator.mediaDevices.getDisplayMedia({
                    video: true,
                    audio: true
                });

            await setLocalMedia(stream);
        }


        /*
         * ==========================================
         * 6. GẮN MEDIA VÀO TRANSCEIVER
         * ==========================================
         */

        async function setLocalMedia(stream) {
            // Dừng tracks cũ trước khi đổi luồng mới (ví dụ từ camera sang share screen)
            if (localStream && localStream !== stream) {
                localStream.getTracks().forEach(track => track.stop());
            }

            localStream = stream;
            localVideo.srcObject = stream;

            const videoTrack = stream.getVideoTracks()[0] ?? null;
            const audioTrack = stream.getAudioTracks()[0] ?? null;

            // LẤY TRANSCEIVER ĐÚNG CHUẨN
            const vt = getTransceiver("video");
            const at = getTransceiver("audio");

            if (videoTrack) {
                await vt.sender.replaceTrack(videoTrack);
                videoTrack.onended = () => stopMedia();
            } else {
                await vt.sender.replaceTrack(null);
            }

            if (audioTrack) {
                await at.sender.replaceTrack(audioTrack);
            } else {
                await at.sender.replaceTrack(null);
            }

            vt.direction = "sendrecv";
            at.direction = "sendrecv";
        }

        /*
         * ==========================================
         * 7. STOP MEDIA
         * ==========================================
         */

        function stopMedia() {
            if (!localStream) return;

            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
            localVideo.srcObject = null;

            getTransceiver("video").sender.replaceTrack(null);
            getTransceiver("audio").sender.replaceTrack(null);
        }


        /*
         * ==========================================
         * 8. CREATE OFFER
         * ==========================================
         */

        async function createOffer() {
            getTransceiver("video").direction = "sendrecv";
            getTransceiver("audio").direction = "sendrecv";

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            await waitForIceGatheringComplete();
            localSdp.value = JSON.stringify(pc.localDescription, null, 2);
        }


        /*
         * ==========================================
         * 9. CREATE ANSWER
         * ==========================================
         */

        async function createAnswer() {

            if (pc.signalingState !== "have-remote-offer") return;

            if (!localStream) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    await setLocalMedia(stream);
                } catch (e) { }
            }

            getTransceiver("video").direction = "sendrecv";
            getTransceiver("audio").direction = "sendrecv";

            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            await waitForIceGatheringComplete();
            localSdp.value = JSON.stringify(pc.localDescription, null, 2);

            console.log("Answer created");
            console.log("LOCAL ANSWER SDP:", pc.localDescription.sdp);
            console.log("POST-ANSWER TRANSCEIVERS:",
                pc.getTransceivers().map(t => ({
                    kind: t.receiver.track.kind,
                    direction: t.direction,
                    currentDirection: t.currentDirection,
                    senderTrack: t.sender.track?.label ?? null,
                }))
            );
        }


        /*
         * ==========================================
         * 10. SET REMOTE SDP
         * ==========================================
         */

        async function setRemoteSdp() {

            const description = JSON.parse(
                remoteSdp.value
            );

            await pc.setRemoteDescription(description);

            console.log(
                "Remote SDP set:",
                description.type
            );

            console.log(
                "Signaling state:",
                pc.signalingState
            );
        }


        /*
         * ==========================================
         * 11. WAIT ICE
         * ==========================================
         */

        function waitForIceGatheringComplete() {

            return new Promise(resolve => {

                if (
                    pc.iceGatheringState === "complete"
                ) {
                    resolve();
                    return;
                }

                const checkState = () => {

                    if (
                        pc.iceGatheringState === "complete"
                    ) {
                        pc.removeEventListener(
                            "icegatheringstatechange",
                            checkState
                        );

                        resolve();
                    }
                };

                pc.addEventListener(
                    "icegatheringstatechange",
                    checkState
                );
            });
        }

    </script>

</body>

</html>
